<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded container with subtle dark stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" />
  
  <!-- Subtle financial grid backdrop -->
  <line x1="14" y1="46" x2="50" y2="46" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Ascent candlestick / volume bar -->
  <rect x="16" y="36" width="6" height="10" rx="1.5" fill="#334155" />
  <rect x="26" y="28" width="6" height="18" rx="1.5" fill="#00E676" />
  <rect x="36" y="20" width="6" height="26" rx="1.5" fill="#334155" />

  <!-- Dynamic Upward Growth Arrow Trajectory -->
  <path d="M 14 44 C 24 40, 32 30, 48 16" stroke="#00E676" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Sharp Arrowhead -->
  <path d="M 38 16 L 48 16 L 48 26" stroke="#00E676" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Luminous dot at peak -->
  <circle cx="48" cy="16" r="3" fill="#FFFFFF" />
</svg>
