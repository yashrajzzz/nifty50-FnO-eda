services:
  - type: web
    name: nifty50-fno-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: NIFTY 50 Futures and Options Analytics API
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONPATH
        value: .
      - key: BACKEND_CORS_ORIGINS
        value: '["https://futures-and-options.vercel.app","http://localhost:3000","http://127.0.0.1:3000"]'
